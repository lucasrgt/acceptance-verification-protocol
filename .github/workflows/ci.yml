name: ci

# The verifier verifies itself through the same canonical mini harness used
# locally and by releases. The geometry benches run for real here: Ubuntu
# runners ship Chrome, so `describe.skipIf(!hasBrowser)` does not skip in CI.
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  js:
    name: AVP mini harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: assay/package-lock.json
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.x"
      - uses: taiki-e/install-action@v2
        with:
          tool: tokei
      - name: install
        working-directory: assay
        run: npm ci
      - name: canonical verification
        working-directory: assay
        run: npm run verify
