name: ci

# The verifier verifies itself through the same canonical mini harness used
# locally and by releases. The geometry benches run for real here: Ubuntu
# runners ship Chrome, so `describe.skipIf(!hasBrowser)` does not skip in CI.
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  js:
    name: AVP mini harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: assay/package-lock.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - uses: taiki-e/install-action@v2
        with:
          tool: tokei
      - name: install
        working-directory: assay
        run: npm ci
      - name: canonical verification
        working-directory: assay
        run: npm run verify
